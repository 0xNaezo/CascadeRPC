[package]
name = "rpc-load-balancer"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "signal",
    "fs",
] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0.222", features = ["derive"] }
serde_json = "1.0.149"
anyhow = "1"
# `release_max_level_info` compiles every `trace!`/`debug!` out of a release
# build: the request path has one of each per attempt, and even disabled they
# cost a runtime level check on every request.
tracing = { version = "0.1", features = ["release_max_level_info"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15.7"
axum = "0.8"
url = "2.5"
bytes = "1.12"
memchr = "2"
governor = "0.10"
arc-swap = "1.9"
config = { version = "0.15", features = ["toml"] }
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18.3"
time = { version = "0.3", features = [
    "macros",
    "serde",
    "serde-human-readable",
] }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = 0 }
nursery = { level = "warn", priority = 0 }
unwrap_used = { level = "deny", priority = 1 }
expect_used = { level = "deny", priority = 1 }
panic = { level = "deny", priority = 1 }

[dev-dependencies]
serial_test = "4.0.1"

[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
