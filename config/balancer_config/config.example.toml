# Edits here are applied on SIGHUP, without a restart: `kill -HUP <pid>`.
# The [server] section is the exception — the listener is only bound at startup.
#
# `name` is a node's identity, not a label. Monthly usage is tracked and stored
# under it, so renaming a node reads as "one node left, another arrived": the
# new name starts the month from zero and may overspend the provider's quota.
# It also breaks the "node" label on every metric. Rename between billing
# periods, or not at all.

[server]
host = "0.0.0.0"
port = 3000
enable_metrics = false # only enable behind internal network boundary

[[nodes]]
name = "Helius"
url = "https://mainnet.helius-rpc.com/?api-key=$HELIUS_API_KEY"
tier = 1
rps_limit = 10
max_concurrent = 4
monthly_limit = 50_000_000
billing_type = "compute_units"
provider_pricing_path = "config/provider_config/helius.toml"

[[nodes]]
name = "Alchemy"
url = "https://solana-mainnet.g.alchemy.com/v2/$ALCHEMY_API_KEY"
tier = 0
rps_limit = 20
max_concurrent = 8
monthly_limit = 20_000_000
billing_type = "compute_units"
provider_pricing_path = "config/provider_config/alchemy.toml"

[[nodes]]
name = "public-mainnet"
url = "https://api.mainnet-beta.solana.com"
tier = 2
rps_limit = 5
max_concurrent = 2
monthly_limit = 0
billing_type = "requests"
provider_pricing_path = "config/provider_config/solana.toml"
